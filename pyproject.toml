[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[project]
name = "saleor-fastapi-backend"
version = "0.1.0"
description = "A learning-oriented e-commerce backend built with FastAPI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.120.0,<1.0.0",
    "uvicorn[standard]>=0.38.0,<1.0.0",
    "pydantic-settings>=2.11.0,<3.0.0",
    "sqlalchemy[asyncio]>=2.1.8,<3.0.0",
    "asyncmy>=0.2.18,<1.0.0",
    "alembic>=1.20.1,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0,<10.0.0",
    "httpx>=0.28.0,<1.0.0",
    "ruff>=0.14.0,<1.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
